name: Validate marketplace

on:
  push:            # every branch, so work in progress is verified before it reaches a PR or main
  pull_request:

# One run per ref: a rapid follow-up push supersedes the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for p in plugins/*/; do
            found=1
            echo "::group::$p"
            claude plugin validate "$p"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No plugins found under plugins/ — skipping per-plugin validation."
          fi

      - name: Check version sync (plugin.json ↔ marketplace.json ↔ pyproject.toml)
        run: ./scripts/check-version-sync.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Runs each project's own `make check` — ruff, ruff format --check, ty, pytest — so the
      # local gate and CI are the same command by construction and cannot drift apart.
      - name: Lint, typecheck and test each Python project
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            dir=$(dirname "$proj")
            if [ ! -d "$dir/tests" ]; then
              echo "Skipping $dir — no tests/ directory."
              continue
            fi
            if [ ! -f "$dir/Makefile" ]; then
              echo "::error::$dir has tests/ but no Makefile — every in-tree Python project carries the shared one."
              exit 1
            fi
            echo "::group::$dir"
            # --locked verifies the lock matches pyproject; UV_FROZEN then stops the
            # Makefile's own `uv run` calls from rewriting it. The two flags conflict
            # on one command, so they are applied separately.
            (cd "$dir" && uv sync --locked --group dev --quiet && UV_FROZEN=1 make check)
            echo "::endgroup::"
          done < <(find plugins -name pyproject.toml -not -path '*/.venv/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No in-tree Python projects found."
          fi
