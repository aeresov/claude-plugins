name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for p in plugins/*/; do
            found=1
            echo "::group::$p"
            claude plugin validate "$p"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No plugins found under plugins/ — skipping per-plugin validation."
          fi

      - name: Check version sync (plugin.json ↔ marketplace.json ↔ pyproject.toml)
        run: |
          set -euo pipefail
          fail=0
          for p in plugins/*/; do
            manifest="$p.claude-plugin/plugin.json"
            name=$(jq -r .name "$manifest")
            pv=$(jq -r .version "$manifest")
            mv=$(jq -r --arg n "$name" '.plugins[] | select(.name == $n) | .version' .claude-plugin/marketplace.json)
            if [ "$pv" != "$mv" ]; then
              echo "::error::$name: plugin.json version ($pv) != marketplace.json entry ($mv)"
              fail=1
            fi
            while IFS= read -r proj; do
              tv=$(grep -m1 -E '^version *= *"' "$proj" | sed -E 's/^version *= *"([^"]*)".*/\1/')
              if [ "$tv" != "$pv" ]; then
                echo "::error::$name: $proj version ($tv) != plugin.json version ($pv)"
                fail=1
              fi
            done < <(find "$p" -name pyproject.toml -not -path '*/.venv/*' | sort)
          done
          exit "$fail"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run plugin test suites
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            dir=$(dirname "$proj")
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              (cd "$dir" && uv sync --group dev --quiet && uv run --quiet pytest -q)
              echo "::endgroup::"
            else
              echo "Skipping $dir — no tests/ directory."
            fi
          done < <(find plugins -name pyproject.toml -not -path '*/.venv/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No in-tree Python projects found."
          fi
