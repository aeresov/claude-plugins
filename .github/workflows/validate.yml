name: Validate marketplace

on:
  push:            # every branch, so work in progress is verified before it reaches a PR or main
  pull_request:

# One run per ref: a rapid follow-up push supersedes the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate each plugin manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for p in plugins/*/; do
            found=1
            echo "::group::$p"
            claude plugin validate "$p"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No plugins found under plugins/ — skipping per-plugin validation."
          fi

      - name: Check version sync (plugin.json ↔ marketplace.json ↔ pyproject.toml)
        run: ./scripts/check-version-sync.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run plugin test suites
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r proj; do
            found=1
            dir=$(dirname "$proj")
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              (cd "$dir" && uv sync --locked --group dev --quiet && uv run --quiet pytest -q)
              echo "::endgroup::"
            else
              echo "Skipping $dir — no tests/ directory."
            fi
          done < <(find plugins -name pyproject.toml -not -path '*/.venv/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No in-tree Python projects found."
          fi
